<title>F-5M VRAD Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Saira+Condensed:wght@500;700&display=swap">
<style>
/* Layout: consola de cabina — columna HOTAS | MFD con bisel | lección + mapa del instructor; documentación debajo */
:root{
  --bg:#101413;          /* gris carbón con sesgo verde fósforo */
  --panel:#171d1b;
  --panel-2:#1e2522;
  --line:#2c3632;
  --fg:#d9e3dd;
  --muted:#8c9c94;
  --placard:#e9b44c;     /* ámbar de rotulación de panel */
  --phos:#46e86a;        /* verde MFD */
  --cyan:#45dcf0;
  --mag:#ff5ad9;
  --red:#ff5050;
  --ok:#5fd38a;
  --bezel:#8d9290;
  --bezel-d:#5d6260;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"B612",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"B612 Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--cyan)}
kbd{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg);white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--placard)}

/* barra superior */
.top{border-bottom:1px solid var(--line);background:var(--panel)}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:26px}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 10px;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.on{border-color:var(--placard);color:var(--placard)}
.btn:focus-visible,.osb:focus-visible,.hk:focus-visible{outline:2px solid var(--placard);outline-offset:2px}

/* cabina */
.cockpit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;padding-block:14px;align-items:start}
.mfdcol{width:clamp(340px,calc((100dvh - 210px)*0.77),560px)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:12px;align-items:start}
@media (max-width:1300px){.mapgrid{grid-template-columns:minmax(0,1fr)}.mapgrid canvas#map{max-width:340px}}
.hotasdet{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.hotasdet>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:12px 14px;user-select:none}
.hotasdet>summary::-webkit-details-marker{display:none}
.hotasdet>summary:hover .sum-t,.hotasdet[open]>summary .sum-t{color:var(--placard)}
.hotasdet>summary:focus-visible{outline:2px solid var(--placard);outline-offset:2px}
.sum-t{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
.sum-s{color:var(--muted);font-size:13px;flex:1;min-width:200px}
.sum-i{font-size:16px;color:var(--placard);transition:transform .15s}
.hotasdet[open] .sum-i{transform:rotate(180deg)}
.hotasdet .hotas{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:12px;padding:0 12px 12px}
.hotasdet .hotas>.panel:last-child{grid-column:1/-1}
.hsvg2 .kb rect{fill:#0b0e0d;stroke:var(--placard);stroke-width:1.4}
.hsvg2 .kb text{fill:var(--placard);font:700 14px var(--f-mono)}
.hsvg2 .kb{pointer-events:none}
@media (max-width:1000px){.cockpit{grid-template-columns:minmax(0,1fr)}.mfdcol{max-width:560px;width:100%;justify-self:center}.mapgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}.mapgrid canvas#map{max-width:none}}
@media (max-width:560px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px}
.panel h3{font-size:15px;color:var(--placard);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}

.hotas{display:flex;flex-direction:column;gap:12px;min-width:0}

.hsvg{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hsvg text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.hsvg .t{fill:var(--placard);font-weight:700;letter-spacing:.04em}
.hsvg .lb{fill:var(--fg)}
.hsvg .lead{stroke:#4b5852;stroke-width:.8;fill:none}
.hsvg .al{stroke:var(--fg);stroke-width:1.6}
.hsvg .ah,.hsvg .dot{fill:var(--fg)}
.hsvg .grip{fill:url(#gGrip);stroke:#596266;stroke-width:1.4}
.hsvg .boot{fill:#161a19;stroke:#2e3633}
.hsvg .stitch{stroke:#36403c;stroke-dasharray:3 3;fill:none}
#gripT .hsvg .grip{fill:url(#gThr)}
.hs{cursor:pointer;outline:none}
.hs .hit{fill:transparent;stroke:none}
.hs:hover .hit,.hs:focus-visible .hit{fill:rgba(233,180,76,.13);stroke:var(--placard);stroke-width:.8}
.hs.held .al{stroke:var(--placard)}.hs.held .ah,.hs.held .lb{fill:var(--placard)}
.hs:hover .swp,.swp.on{filter:drop-shadow(0 0 3px var(--placard))}
.swp.on *{stroke:var(--placard)}
.hsvg .dim{opacity:.3}
.keys{margin:6px 0 0;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);line-height:2}
.keys kbd{font-size:10px;margin:0 1px}
.hscroll{overflow-x:auto;margin:0 -4px}
.hsvg2{display:block;width:100%;min-width:560px;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.hsvg2 .hit{fill:transparent;stroke:none}
.hsvg2 .hs:hover .hit,.hsvg2 .hs:focus-visible .hit{fill:rgba(233,180,76,.14);stroke:var(--placard);stroke-width:1.6}
.hsvg2 .hs.held .hit{fill:rgba(233,180,76,.32);stroke:var(--placard);stroke-width:2}
.hsvg2 .chev{fill:none;stroke:var(--placard);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.hsvg2 .glow{fill:rgba(233,180,76,.0);stroke:none;pointer-events:none;transition:fill .08s}
.hsvg2 .glow.on{fill:rgba(233,180,76,.55)}
.hsvg2 .dimr{fill:var(--panel);opacity:.68;pointer-events:none}
.hsvg2 .dimr.always{opacity:.5}
.ctl[hidden]{display:none}
.ctl{position:fixed;inset:0;z-index:40;background:rgba(5,8,7,.72);display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.ctl-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.ctl-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px 6px}
.ctl-h h2{font-size:24px}
.ctl-p{margin:4px 16px;color:var(--muted);font-size:13px;max-width:none}
.ctl-tbl{overflow:auto;padding:0 16px 8px;margin-top:6px}
.ctl-tbl table{width:100%;min-width:520px}
.ctl-tbl tr.grp th{padding-top:12px;color:var(--placard)}
.ctl-voz{margin:8px 16px 4px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px}
.ctl-voz h3{font-size:15px;color:var(--placard);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
.vz-row{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:6px}
.vz-row label{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.vz-row select{font:13px var(--f-body);color:var(--fg);background:#0b0e0d;border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0}
@media (max-width:600px){.vz-row{grid-template-columns:minmax(0,1fr) auto}.vz-row label{grid-column:1/-1}}
.slot{font-family:var(--f-mono);font-size:12px;min-width:120px;text-align:left;background:#0b0e0d;border:1px solid var(--line);border-radius:4px;padding:5px 8px;color:var(--fg)}
.slot:hover{border-color:var(--muted)}.slot.cap{border-color:var(--placard);color:var(--placard)}.slot:disabled{opacity:.45;cursor:not-allowed}
.grip svg{width:78px;height:auto;display:block}
.grip svg .body{fill:#242c29;stroke:#56625c;stroke-width:1.5}
.grip svg .mk circle{fill:#101413;stroke:var(--muted);stroke-width:1.2}
.grip svg .mk text{fill:var(--muted);font:700 8px var(--f-mono);text-anchor:middle;dominant-baseline:central}
.grip svg .mk.on circle{fill:var(--placard);stroke:var(--placard)}.grip svg .mk.on text{fill:#1a1405}
.grip svg .mk{cursor:pointer}
.sws{display:flex;flex-direction:column;gap:8px;min-width:0}
.hat{border-top:1px solid var(--line);padding-top:6px}
.hat:first-child{border-top:0;padding-top:0}
.hat-h{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.hat-h b{color:var(--placard);font-weight:400;margin-right:4px}
.hat-h.lit b{background:var(--placard);color:#1a1405;padding:0 3px;border-radius:2px}
.hat-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.hat-g .u{grid-area:1/2}.hat-g .l{grid-area:2/1}.hat-g .c{grid-area:2/2}.hat-g .r{grid-area:2/3}.hat-g .d{grid-area:3/2}
.hat-g.two{grid-template-columns:repeat(2,minmax(0,1fr))}.hat-g.two .u{grid-area:auto}.hat-g.two .d{grid-area:auto}.hat-g.two .c{grid-area:auto}
.hat-g.three{grid-template-columns:repeat(3,minmax(0,1fr))}.hat-g.three>*{grid-area:auto!important}
.hk.sw{flex-direction:column;justify-content:center;gap:1px;padding:4px 3px;font-size:9.5px;text-align:center;line-height:1.2;min-height:40px}
.hk.sw .ar{font-size:10px;color:var(--muted)}
.hk.sw .lb{color:var(--fg);word-break:break-word}
.hk.sw.na .lb{color:#5d6a63}
.hk.sw kbd{font-size:9px;padding:0 3px}
.hk.sw.c{border-radius:50%/40%}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:3px}
.hgrp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hgrp .full{grid-column:1/-1}
.hk{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-align:left;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hk:active,.hk.held{border-color:var(--placard);background:#2a2618}
.hk kbd{font-size:10px}
.sublbl{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.1em;margin:4px 0 2px;grid-column:1/-1}
.flight{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-family:var(--f-mono);font-size:11px}
.readout{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;background:#0b0e0d;border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--phos);font-variant-numeric:tabular-nums}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px}
.sw .btn{padding:4px 8px}

/* MFD */
.mfdcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.bezel{background:linear-gradient(160deg,var(--bezel),var(--bezel-d));border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.bz{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;grid-template-rows:30px auto 30px;gap:6px}
.row{display:flex;justify-content:space-around;align-items:center}
.col{display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.osb{width:34px;height:20px;border-radius:3px;background:linear-gradient(#5a5f5d,#3b3f3d);border:1px solid #2a2d2c;box-shadow:inset 0 1px 0 rgba(255,255,255,.18);padding:0}
.col .osb{width:22px;height:30px}
.osb:active{background:#2c302e}
.screen{position:relative;background:#000;border-radius:6px;overflow:hidden;border:2px solid #222}
.screen canvas{display:block;width:100%;height:auto;aspect-ratio:560/720}
.status{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.status b{color:var(--fg);font-weight:400}
.log{font-family:var(--f-mono);font-size:12px;background:#0b0e0d;border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-height:56px;color:var(--phos)}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log div.w{color:var(--placard)}
.log div.k{color:var(--red)}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.lesson h2{font-size:22px;margin:2px 0 6px}
.lesson ol{margin:6px 0 10px;padding-left:20px}
.lesson li{margin:3px 0}
.obj{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.pill{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;padding:2px 7px;border-radius:10px;border:1px solid var(--placard);color:var(--placard);white-space:nowrap}
.pill.done{border-color:var(--ok);color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mapwrap canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#0a0d0c;border:1px solid var(--line);border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:middle}
.overlay[hidden],.panel[hidden],.gate[hidden],.gate-err[hidden]{display:none}
.gate{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(circle at 50% 42%,rgba(70,232,106,.10),transparent 55%),repeating-radial-gradient(circle at 50% 42%,transparent 0 59px,rgba(70,232,106,.07) 59px 60px)}
.gate-card{width:min(340px,100%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:8px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.gate-t{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.03em}
.gate-s{margin:0 0 8px;color:var(--muted);font-size:13px}
.gate-card label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.gate-card input:not([type=checkbox]){font:15px var(--f-mono);color:var(--fg);background:#0b0e0d;border:1px solid var(--line);border-radius:4px;padding:9px 10px}
.gate-card input:focus{outline:2px solid var(--placard);outline-offset:1px}
.gate-card .gate-rem{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:13px;color:var(--fg)}
.gate-btn{margin-top:6px;font-family:var(--f-mono);letter-spacing:.12em;background:var(--placard);color:#1a1405;border:0;border-radius:4px;padding:10px;font-weight:700}
.gate-btn:disabled{opacity:.6}
.gate-err{margin:0;color:var(--red);font-size:13px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-family:var(--f-mono);color:var(--placard);font-size:20px;letter-spacing:.2em}

/* documentación */
.doc{padding-block:28px 48px;border-top:1px solid var(--line)}
.doc h2{font-size:30px;margin-bottom:10px}
.doc h3{font-size:20px;margin:22px 0 6px;color:var(--fg)}
.doc p,.doc li{max-width:68ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--muted)}
.card .n{font-family:var(--f-mono);font-size:11px;color:var(--placard);letter-spacing:.12em;display:flex;justify-content:space-between}
.card .n .ok{color:var(--ok)}
.card b{font-family:var(--f-display);font-size:18px;font-weight:700}
.card span{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;font-size:13px;min-width:560px}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--placard);font-weight:400}
td.m{font-family:var(--f-mono);white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 32px}
dl{margin:0}
dt{font-family:var(--f-mono);color:var(--placard);margin-top:10px}
dd{margin:2px 0 0;color:var(--fg)}
.note{border-left:3px solid var(--placard);padding:6px 12px;background:var(--panel);max-width:80ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* lado derecho: HUD + lección | mapa + perfil */
.side{display:grid!important;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-areas:"hud map" "lesson map";gap:12px;align-items:start}
#hudPanel{grid-area:hud}#mapPanel{grid-area:map}#lessonPanel{grid-area:lesson}
#hudc{display:block;width:100%;height:auto;aspect-ratio:520/340;border-radius:6px;border:1px solid #26332d;background:#030504}
.mapgrid,.mapgrid canvas#map{grid-template-columns:minmax(0,1fr)!important;max-width:none!important}
@media (max-width:700px){.side{grid-template-columns:minmax(0,1fr);grid-template-areas:"hud" "lesson" "map"}}
/* === disposición F-18 style: gases+HUD | MFD+vuelo | palanca+mapa === */
.cockpit3{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;padding-block:12px;align-items:start}
.cl,.cr{display:flex;flex-direction:column;gap:12px;min-width:0}
.cm{display:flex;flex-direction:column;gap:8px;min-width:0;width:clamp(340px,calc((100dvh - 215px)*0.75),560px)}
.cm .bezel{width:100%}
.ctrl h3{margin-bottom:6px}
.sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);margin:2px 0 6px}
.cb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:5px 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;color:var(--fg);text-align:center;line-height:1.25;min-height:40px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.cb:hover{border-color:var(--muted)}
.cb.held,.cb:active{border-color:var(--placard);background:#2a2618}
.cb kbd{font-size:10px;color:var(--placard);border-color:#4a3f22;background:#16130b}
.cb.pk{border-color:#6a2a20;background:#2a1612}.cb.pk.held{background:#4a1a12;border-color:var(--red)}
.cb.wide{width:100%;margin-top:6px}
.cb2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cb3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.thr{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;align-items:center}
.thr-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.tdcpad{position:relative;width:118px;height:118px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b3330,#141917);border:1px solid var(--line);touch-action:none;cursor:grab;user-select:none}
.tdcpad:active{cursor:grabbing}
.tdc-ring{position:absolute;inset:24px;border-radius:50%;border:1px dashed #3a4641}
.tdc-knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7c8783,#3a423f);box-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none}
.tdc-k{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:2px;pointer-events:none}
.tdc-k kbd{font-size:9px;padding:0 3px;color:var(--placard)}
.pwr{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.pwr .btn{padding:4px 9px}
.s4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:". u ." "l c r" ". d .";gap:6px}
.s4 .u{grid-area:u}.s4 .l{grid-area:l}.s4 .c{grid-area:c}.s4 .r{grid-area:r}.s4 .d{grid-area:d}
.s4 .c{border-radius:50%/42%}
.fbar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:5px 2px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.03em;color:var(--fg);min-height:42px;touch-action:manipulation;user-select:none}
.fb.held,.fb:active{border-color:var(--placard);background:#2a2618}
.fb kbd{font-size:9px;padding:0 3px;color:var(--placard)}
.fr{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0e0d;border:1px solid var(--line);border-radius:4px;font-family:var(--f-mono);min-height:42px}
.fr b{font-size:11.5px!important}.fr span{font-size:9px;color:var(--muted);letter-spacing:.1em}.fr b{font-weight:400;font-size:12px;color:var(--phos);font-variant-numeric:tabular-nums;white-space:nowrap}
.mapwrap.small canvas#map{max-width:200px;margin-inline:auto}
.mapwrap.small canvas#prof{aspect-ratio:400/170}
.mapwrap.small .legend{font-size:10px}
#hudc{display:block;width:100%;height:auto;aspect-ratio:520/340;border-radius:6px;border:1px solid #26332d;background:#030504}
.below{display:flex;flex-direction:column;gap:14px;padding-block:0 18px}
.belowgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.belowgrid .log{min-height:110px}
.belowgrid #lessonPanel{grid-area:auto}
.hotasimg .hotas{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:12px}
.hotasimg .hotas>.panel{background:var(--panel-2)}
@media (max-width:1180px){.cockpit3{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"cm cm" "cl cr"}.cm{grid-area:cm;justify-self:center;width:min(100%,560px)}.cl{grid-area:cl}.cr{grid-area:cr}}
@media (max-width:720px){.cockpit3{grid-template-columns:minmax(0,1fr);grid-template-areas:"cm" "cr" "cl"}.belowgrid{grid-template-columns:minmax(0,1fr)}.fbar{grid-template-columns:repeat(5,minmax(0,1fr))}}
.radio{margin-top:8px;background:#060a08;border:1px solid #26332d;border-radius:6px;padding:6px 10px;font-family:var(--f-mono);font-size:12px}
.radio-h{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.radio-h #radioCh{color:var(--placard)}
.rx{color:#9fb3a8;padding:2px 0;line-height:1.35}.rx span{color:#5d6d65;margin-right:8px}
.rx.new{color:var(--placard)}
.rx-empty{color:#4a5a52}
.arm{display:inline-flex}.arm .btn{border-radius:0;margin-left:-1px;padding:4px 8px}.arm .btn:first-child{border-radius:4px 0 0 4px}.arm .btn:last-child{border-radius:0 4px 4px 0}.arm .btn.on[data-arm=ARM]{border-color:var(--red);color:var(--red)}

.gate-load{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0}
</style>

    <p class="gate-s">Simulación del radar virtual. Contenido cifrado: introduce tus credenciales.</p>
    <label for="gUser">Usuario</label>
    <input id="gUser" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" required>

    <label class="gate-rem"><input type="checkbox" id="gRem"> Recordar en este equipo</label>
    <button type="submit" class="gate-btn" id="gBtn">ENTRAR</button>
    <p class="gate-err" id="gErr" role="alert" hidden>Usuario o contraseña incorrectos.</p>
  </form>
</div>

const b64=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
const $=id=>document.getElementById(id);
async function derive(u,p){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(u.trim().toUpperCase()+":"+p),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])}
async function open(k){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},k,b64(ENC.ct));return JSON.parse(new TextDecoder().decode(pt))}
function mount(p){$("app").innerHTML=p.html;const s=document.createElement("script");s.textContent=p.js;document.body.appendChild(s);$("gate").hidden=true;document.body.style.overflow=""}
document.body.style.overflow="hidden";
(async()=>{try{const raw=localStorage.getItem("f5vrad.key2");if(raw){const k=await crypto.subtle.importKey("raw",b64(raw),{name:"AES-GCM"},true,["decrypt"]);mount(await open(k));return}}catch(e){try{localStorage.removeItem("f5vrad.key2")}catch(_){}}$("gUser").focus()})();
$("gateForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("gBtn"),err=$("gErr");btn.disabled=true;btn.textContent="DESCIFRANDO…";err.hidden=true;
  try{const k=await derive($("gUser").value,$("gPass").value);const p=await open(k);
    if($("gRem").checked){try{const raw=new Uint8Array(await crypto.subtle.exportKey("raw",k));localStorage.setItem("f5vrad.key2",btoa(String.fromCharCode(...raw)))}catch(_){}}
    $("gPass").value="";mount(p)}
  catch(_){err.hidden=false;$("gPass").select()}
  btn.disabled=false;btn.textContent="ENTRAR"});
})();
</script>
