name: Compilar app de escritorio
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copiar el simulador cifrado
        run: cp index.html app/index.html
      - name: Instalar dependencias
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Compilar (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never
      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: F-5M VRAD ${{ github.ref_name }}
          files: out/*
          body: |
            Aplicación de escritorio de la simulación F-5M VRAD (mismo acceso cifrado que la web).
            - **Mac**: archivo .dmg (Intel y Apple Silicon). Primera vez: clic derecho sobre la app → Abrir.
            - **Windows**: "Setup" instala la app; "portable" se ejecuta sin instalar. Si aparece SmartScreen: Más información → Ejecutar de todas formas.
